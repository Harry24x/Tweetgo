name: Backend tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tweetgo-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B test
      - name: Report test results
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            line=$(grep -m1 "Tests run" "$f")
            echo "$(basename "$f" .txt): $line" >> "$GITHUB_STEP_SUMMARY"
            if echo "$line" | grep -qE "(Failures|Errors): [1-9]"; then
              echo "::error title=$(basename "$f" .txt)::$(grep -m3 -E 'Exception|Error|expected' "$f" | tr '\n' ' ' | cut -c1-400)"
            fi
          done
