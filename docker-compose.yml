services:

  db:
    image: mariadb:latest
    container_name: tweetgo-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=tweetgo
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    container_name: tweetgo-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db


  backend:
    build:
      context: ./tweetgo-backend
      dockerfile: Dockerfile
    image: tweetgo-backend:latest
    container_name: tweetgo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/tweetgo?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build:
      context: ./tweetgo-frontend
      dockerfile: Dockerfile
    container_name: tweetgo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mariadb_data: