# Use H2 for tests
spring.datasource.url=jdbc:h2:mem:tweetgo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT properties (so JwtUtil and SecurityConfig can initialize)
jwt.secret=UnitTestSecretKey
jwt.expirationMs=3600000

# Disable springdoc (if you?re using it)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.org.springframework.test.context=warn